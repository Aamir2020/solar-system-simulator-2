name: Physics and desktop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      QT_QPA_PLATFORM: xcb
      ORBITAL_DESKTOP_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 \
            libdbus-1-3 libx11-xcb1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-util1 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-glx0 libxcb-randr0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinput0
      - name: Install application and check tools
        run: python -m pip install -e '.[dev]'
      - name: Check Qt X11 runtime dependencies and startup
        run: xvfb-run -a -s '-screen 0 1280x1024x24' python scripts/check_desktop.py
      - name: Scientific, data, shader, and desktop smoke checks
        run: xvfb-run -a -s '-screen 0 1280x1024x24' python -m unittest discover -s tests -v
      - name: Headless integration
        run: solar-system --headless --steps 365
      - name: Build source and wheel distributions
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ matrix.python-version }}
          path: dist/*
