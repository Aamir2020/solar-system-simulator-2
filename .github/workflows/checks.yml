name: Physics and desktop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      QT_QPA_PLATFORM: xcb
      ORBITAL_DESKTOP_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0
      - name: Install application and check tools
        run: python -m pip install -e '.[dev]'
      - name: Scientific, data, shader, and desktop smoke checks
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Headless integration
        run: solar-system --headless --steps 365
      - name: Build source and wheel distributions
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ matrix.python-version }}
          path: dist/*
