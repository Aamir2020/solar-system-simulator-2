[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-system-simulator"
version = "2.0.0"
description = "A GPU-rendered Python solar system with leapfrog N-body physics and NASA Horizons data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "src/solar_system_simulator/assets/textures/ATTRIBUTION.md"]
authors = [{name = "Aamir Zekaria Ali"}]
dependencies = [
    "numpy>=2.0,<3",
    # Qt 6.12 wheels regress reference counting on CPython 3.10/3.11 (PYSIDE-3474).
    "PySide6>=6.7,<6.12; python_version < '3.12'",
    "PySide6>=6.7,<7; python_version >= '3.12'",
    "moderngl>=5.10,<6",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "build>=1.2,<2", "pyinstaller>=6.10,<7"]

[project.scripts]
solar-system = "solar_system_simulator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solar_system_simulator = [
    "assets/*.json", "assets/*.svg", "assets/*.md", "assets/textures/*.jpg", "assets/textures/*.json",
    "assets/textures/*.md", "rendering/*.glsl",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
